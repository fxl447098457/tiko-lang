title: "tiko by Example"
author: "Paul Squires"

## --- the pin -------------------------------------------------------------
## Every example on the site is compiled and run with exactly these
## toolchains. tools/check-examples.sh refuses to run if a toolchain's
## MANIFEST does not match, because a stale toolchain yields a plausible
## result rather than an error.
pin:
  version: "0.1.6"
  windows:
    root: "../toolchains/tiko-windows"      # relative to this directory
    exe: "tiko.exe"
    commit: "e7f07a36b"
    packaged: "2026-11-20"
  linux:
    root: "../toolchains/tiko-linux"        # same path, reached through WSL
    exe: "bin/tiko"
    commit: "e7f07a36b"
    packaged: "2026-11-20"
    wsl_distro: "Ubuntu"
  macos:
    root: "../toolchains/tiko-macos"        # on the Mac: the harness runs there (ssh mac)
    exe: "bin/tiko"
    commit: "e7f07a36b"
    packaged: "2026-11-20"
  linux_arm64:
    root: "../toolchains/tiko-linux-arm64"  # in the arm64 VM (TIKO_ARM_VM, default tk22): the harness runs there
    exe: "bin/tiko"
    commit: "e7f07a36b"
    packaged: "2026-11-20"
  targets: [windows-x86_64, linux-x86_64, macos-arm64, linux-arm64]
