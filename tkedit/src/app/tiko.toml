# tkEdit: the application package (GUI on tiko's vendor/tkControls, imported as
# "vendor/tkControls/<module>": it comes with the toolchain). Imported modules: "tka/<module>".
[package]
name = "tka"
version = "0.1.4"

[dependencies]
tkp = { path = "../platform" }
tkc = { path = "../core" }
tks = { path = "../svc" }
tkd = { path = "../design" }

[profile.debug]
options = ["-w", "all"]

# ONE FILE: SDL, SDL_ttf, SDL_image and scintk linked in ('link static' in main.tiko), the data
# '#embed'ded (tka/assets), so nothing is copied beside it (-nocopylibs). bin/ also holds parser.dll,
# which tiko-lang's build copies there.
[target.tkEdit]
main      = "main.tiko"
subsystem = "gui"
options   = ["-mt", "-nocopylibs"]
copy_to   = ["../../bin"]

# the exe's icon: a .rc is Windows-only, and a Linux build refuses one (TK-003)
[target.tkEdit.windows]
resources = ["res/tkEdit.rc"]
