# tkEdit Form Designer: the document model, the .tkform file, validation and code generation.
# No window is opened here. Imported as "tkd/<module>".
[package]
name = "tkd"
version = "0.1.0"

[dependencies]
tkp = { path = "../platform" }
tkc = { path = "../core" }

[profile.debug]
options = ["-w", "all"]

# designall [suite...]: exit code = failures, last line "designall [os] selftest: N passed, M failed"
[target.designall]
main = "tests/designall.tiko"
output = "tests/bin/designall.exe"
