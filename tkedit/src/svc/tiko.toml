# tkEdit services: work that runs beside the window -- processes, readers, workers. No widgets.
# Imported as "tks/<module>". Needs -mt (std/tasks), which the app's target gives it.
[package]
name = "tks"
version = "0.1.4"

[dependencies]
tkp = { path = "../platform" }
tkc = { path = "../core" }

[profile.debug]
options = ["-w", "all"]

# The debug engine's console harness (tks/dapengine without a window): tests/bin/dbgtest <exe> <src> <mode>
[target.dbgtest]
main = "tests/dbgtest.tiko"
output = "tests/bin/dbgtest.exe"
options = ["-mt"]
