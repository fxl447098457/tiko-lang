  { name="TextColor", kind="color", set="tkLabel_SetTextColor", get="tkLabel_GetTextColor", inspector=false },
  { name="BackColor", kind="color", set="tkLabel_SetBackColor", get="tkLabel_GetBackColor", inspector=false },
  { name="Transparent", kind="bool", set="tkLabel_SetTransparent", get="tkLabel_GetTransparent", default="true" },
