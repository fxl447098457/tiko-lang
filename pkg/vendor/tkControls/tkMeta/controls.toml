[[control]]
name = "ChipGroup"
module = "tkChipGroup"
category = "Lists"
width = 300
height = 80
bind = { kind="text", get="tkChipGroup_GetSelectedKeys", set="tkChipGroup_SetSelectedKeys" }
bind2 = { kind="text", get="tkChipGroup_GetItemsText", set="tkChipGroup_SetItemsText", name="BindItems", when="" }
default_event = "SelChange"
colors = { struct="TKCHIP_COLORS", struct_module="tkChip", get="tkChipGroup_GetColors", theme="tkChipGroup_ThemeColors" }
color_fields = [
  { field="BackColor", part="Back", state="Normal" },
  { field="FocusRingColor" },
  { field="FillColor", part="Fill", state="Normal" },
  { field="FillColorHot", part="Fill", state="Hot" },
  { field="FillColorPressed", part="Fill", state="Pressed" },
  { field="FillColorSelected", part="Fill", state="Selected" },
  { field="FillColorSelectedHot" },
  { field="FillColorDisabled", part="Fill", state="Disabled" },
  { field="BorderColor", part="Border", state="Normal" },
  { field="BorderColorHot", part="Border", state="Hot" },
