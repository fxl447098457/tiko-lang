  { name="SelectionMode", kind="enum", enum="None=TKCHIPGRP_NONE,Single=TKCHIPGRP_SINGLE,SingleOrNone=TKCHIPGRP_SINGLE_OR_NONE,Multi=TKCHIPGRP_MULTI", set="tkChipGroup_SetSelectionMode", get="tkChipGroup_GetSelectionMode", default="None" },
