# tkMeta: what a form designer knows about each tkControls control.
# The source of truth for tkMeta.gen.tiko and every <module>.forms.tiko wrapper file.
# After changing it, run examples/tkControls/tools/tkmetagen.
#
# kind: text glyph file int bool float color enum font. enum lists Shown=CONSTANT pairs.
# get = "" means a write-only property; design = false is not applied on the design canvas.
# kind = list: one setter fed by several values, written "1,2,3". enum names them: "Left:int,Top:int" (int float color bool text).
# theme = "CornerRadius" | "BorderWidth", scale = n: a shape setting the theme supplies (value = theme's x scale)
# while the form leaves it unset. inspector = false: kept for old forms and code, not shown (the Colors dialog has it).
#
# colors = { struct, get, theme }: the control's colour struct, its GetColors (get_returns = true when it is a
# function returning the struct) and its ThemeColors. color_fields lists EVERY field of the struct, in order
# (so an entry's position is its slot; tkmetagen checks this against the source):
#   part + state  a cell of the Colors dialog's grid. state: Normal Hot Pressed Disabled Selected Open.
#   group         a second grid of the same parts: Checked (CheckBox), On / Off (Toggle).
#   ink = true    text-like: simple mode copies Normal to Hot and Pressed instead of shading it.
#   no part       an "other" colour, edited on its own (focus rings, dividers, chart series ...).
#
# events: sig is the callback's parameter list, params / args what the handler receives. widget = the
# control as an expression of sig's parameters when it isn't the first one ("p->hButton"). returns =
# the callback's result type when it answers; result = the handler's byref parameter (listed in
# params) whose value the thunk returns, starting from that type's default or from result_init.
# fallback = a procedure the generated code installs when no handler is bound (a ListTree's rows).
#
# bind = { kind, get, set, load_only }: the value a designed form's LoadFrom / SaveTo moves (Form Designer B1),
# through vendor/tkControls/tkBind. kind: text bool int float date. get = "<proc>( h ) as <kind>" (none when
# load_only = true: LoadFrom sets it, SaveTo leaves it), set = "<proc>( h, <kind> )". tkmetagen checks both exist.
# none = the int value that means nothing is chosen (a ComboBox's -1): what B2's Required refuses.
# items_bind = "rows" | "items": how a designed form fills the control's list from an Array( of T ) (B3):
# rows = a ListTree (a row per element, a column per field, the check from a bool field), items = a
# ComboBox (DisplayField shown, ValueField the value Bind moves). AutoComplete, CheckedList and DataGrid
# are to take one of these shapes, or add theirs here.
# records = a Navigator (B4): it steps through an Array( of <the form's DataType> ), loading each record.
# grid = a DataGrid (G5): a row per element, a typed column per field (Kind: text number check combo date
# button link progress), edited in place; LoadFrom fills it, SaveTo writes every row back (ItemsField only).
# bind2 = { kind, get, set, name, when }: a two-value control's second value (a range Slider's upper thumb),
# moved right after bind. name = the designer's row ("BindUpper"); when = "Prop=Shown", the property value it
# needs ("Mode=Range"; "" = always). tkmetagen checks the procedures (in every file of the module) and when.
#
# colors.struct_module: the module that declares the struct when several controls share it (tkNotify's
# TKNOTIFY_COLORS, for InfoBar and Toaster); default the control's own module.
#
# layout_hook = "<proc>": a designed form calls <proc>( h, Layout ) right after the control joins its
# layout (an InfoBar: its height from the bar, the layout re-run when that height changes).
#
# visual = false: a component, not a control (a Timer). It is created on the form and set up like a
# control, but never shown or laid out; a designer draws it as a width x height box of its own.
#
# common_events: events every visual control has, after its own, through a tkHost setter that works
# on any widget. MouseMove: the nearest widget with a watcher is told, so a container's (or the
# form's) handler also sees moves over children that have none.
common_events = [
  { name="MouseMove", set="tkWidget_SetMouseMoveCallback", type="TK_MouseMoveSub", sig="byval hWidget as TK_WIDGET ptr, byval x as int32, byval y as int32, byval buttons as int32, byval mods as int32", params="byval x as int32, byval y as int32, byval buttons as int32, byval mods as int32", args="x, y, buttons, mods" },
]

[[control]]
name = "Label"
module = "tkLabel"
category = "Common"
width = 100
height = 24
bind = { kind="text", set="tkLabel_SetText", load_only=true }
default_event = "Click"
colors = { struct="TKLABEL_COLORS", get="tkLabel_GetColors", theme="tkLabel_ThemeColors" }
color_fields = [
  { field="TextColor", part="Text", state="Normal", ink=true },
  { field="TextColorDisabled", part="Text", state="Disabled", ink=true },
  { field="BackColor", part="Back", state="Normal" },
]
props = [
  { name="Text", kind="text", set="tkLabel_SetText", get="tkLabel_GetText", default="Label" },
  { name="Align", kind="enum", enum="Left=LBL_ALIGN_LEFT,Center=LBL_ALIGN_CENTER,Right=LBL_ALIGN_RIGHT", set="tkLabel_SetAlign", get="tkLabel_GetAlign", default="Left" },
