# vendor/raylib6's binaries, for build/vendorfetch.sh. Read by that script alone and never
# shipped; the entry format is described in ../sqlite3/fetch.toml.
#
# THE NAMES are what '#foreignlib RAYLIB ... "lib/raylib"' probes: raylib_<os>_x86_64.a for
# static -- on Windows that is raylib.lib, an MSVC archive, which the linker reads whatever its
# name -- and for dynamic raylib.dll on Windows and raylib_linux_x86_64.so on Linux. The .so is
# libraylib.so.6.2.0, which names itself libraylib.so.620: tiko copies it beside a program under
# that name, the one the program loads. Both raymath and rlgl are in these libraries.
#
# THE LINUX .so IS BUILT, NOT DOWNLOADED (2026-11-19): raylib's release libraylib.so.6.2.0
# imports fmod@GLIBC_2.38 (and hypot@GLIBC_2.35), so a program linking it dynamically does not
# link on glibc < 2.38 -- Ubuntu 22.04 among them. shared/build.sh builds it from the 6.2 tag's
# source with upstream's own release command, pinned to glibc 2.34 at most like the other
# packages' .so; its exports are upstream's, all 942. The static archive is still upstream's:
# its references bind against the linking system's libm, so it links on 22.04 as it is.
version = "6.2"

[windows.1]
kind = "copy"
url = "https://github.com/raysan5/raylib/releases/download/6.2/raylib-6.2_win64_msvc16.zip"
sha256 = "8467b5dd6db4d7ab942f3148a3d30d93be6ed9b2fab88069d177e59604268ebd"
from = "lib/raylib.dll"
to = "lib/raylib.dll"

[windows.2]
kind = "copy"
url = "https://github.com/raysan5/raylib/releases/download/6.2/raylib-6.2_win64_msvc16.zip"
sha256 = "8467b5dd6db4d7ab942f3148a3d30d93be6ed9b2fab88069d177e59604268ebd"
from = "lib/raylib.lib"
to = "lib/raylib_windows_x86_64.a"

# The source is the 6.2 tag's commit (a lightweight tag), as GitHub archives it.
[linux.1]
kind = "script"
script = "shared/build.sh"
inputs = "https://github.com/raysan5/raylib/archive/02566453880e06bec97f5b8160fa6fe1e98397ca.tar.gz 46d2b8ab1960480d197d84e6d01620c1d920603c2970169c8964d5e6f7a1085a"
from = "shared/bin/linux/libraylib.so.6.2.0"
to = "lib/raylib_linux_x86_64.so"

[linux-arm64.1]
kind = "script"
script = "shared/build.sh"
inputs = "https://github.com/raysan5/raylib/archive/02566453880e06bec97f5b8160fa6fe1e98397ca.tar.gz 46d2b8ab1960480d197d84e6d01620c1d920603c2970169c8964d5e6f7a1085a"
from = "shared/bin/linux-arm64/libraylib.so.6.2.0"
to = "lib/raylib_linux_arm64.so"

[linux.2]
kind = "copy"
url = "https://github.com/raysan5/raylib/releases/download/6.2/raylib-6.2_linux_amd64.tar.gz"
sha256 = "586bbc32f3596d439382b1c5dbc6c1c573eb7e1d00fe92be7d4deb116883720d"
from = "lib/libraylib.a"
to = "lib/raylib_linux_x86_64.a"

[linux-arm64.2]
kind = "script"
script = "shared/build.sh"
inputs = "https://github.com/raysan5/raylib/archive/02566453880e06bec97f5b8160fa6fe1e98397ca.tar.gz 46d2b8ab1960480d197d84e6d01620c1d920603c2970169c8964d5e6f7a1085a"
from = "shared/bin/linux-arm64/libraylib.a"
to = "lib/raylib_linux_arm64.a"
