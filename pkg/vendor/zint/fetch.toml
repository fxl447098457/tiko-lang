# vendor/zint's binaries, for build/vendorfetch.sh. Read by that script alone and never
# shipped; the entry format is described in ../sqlite3/fetch.toml.
#
# zint publishes no library binaries, so every host builds libzint -- the BACKEND only, which is
# BSD-3 (LICENSE); zint's frontend and Qt GUI are GPL-3 and are not taken -- from the pinned
# source archive of the 2.16.0 tag (commit 55541e1). THE SOURCES are backend/CMakeLists.txt's
# zint_SRCS for 2.16.0 (output, common, one-dimensional, postal, two-dimensional) without png.c,
# compiled with ZINT_NO_PNG: no libpng, no zlib. The file outputs (bmp, emf, gif, pcx, ps, svg,
# tif) stay in because library.c and vector.c call them; tkBarcode uses the vector buffer only
# (docs/tkControls/BARCODE.md). On Windows the DLL is built with DLL_EXPORT -- zint.h's own switch
# for __declspec(dllexport) -- and the archive without it.
#
# THE NAMES are what '#foreignlib ZINT ... "lib/zint"' probes: zint_<os>_<arch>.a for static;
# for dynamic zint.dll on Windows, zint_linux_x86_64.so on Linux, zint_linux_arm64.so on
# arm64 Linux and zint_macos_arm64.dylib on macOS.
version = "2.16.0"

[windows.1]
kind = "cbuild"
url = "https://github.com/zint/zint/archive/55541e139e62b9209b71cd9b0ba9010cec28b1d9.tar.gz"
sha256 = "9f09d2ba0838291188fb9fdea36a864b5e1fdd9c1ff9eb1ac673fa38dbfe69cc"
dir = "zint-55541e139e62b9209b71cd9b0ba9010cec28b1d9/backend"
sources = "bmp.c emf.c gif.c output.c pcx.c ps.c raster.c svg.c tif.c vector.c common.c eci.c filemem.c general_field.c gs1.c large.c library.c reedsol.c 2of5.c 2of5inter.c 2of5inter_based.c bc412.c channel.c codabar.c code.c code11.c code128.c code128_based.c dxfilmedge.c medical.c plessey.c rss.c telepen.c upcean.c auspost.c imail.c mailmark.c postal.c aztec.c codablock.c code1.c code16k.c code49.c composite.c dmatrix.c dotcode.c gridmtx.c hanxin.c maxicode.c pdf417.c qr.c ultra.c"
cflags = "-O2 -D_CRT_SECURE_NO_WARNINGS -DZINT_NO_PNG -DDLL_EXPORT"
shared = "lib/zint.dll"

