# vendor/pcre2's binaries, for build/vendorfetch.sh. Read by that script alone and never
# shipped; the entry format is described in ../sqlite3/fetch.toml.
#
# PCRE2 publishes no binaries, so every host builds the 8-bit library -- the 31 C files
# NON-AUTOTOOLS-BUILD lists for it, sljit (deps/sljit) included through pcre2_jit_compile.c --
# from the pinned RELEASE TARBALL. Not GitHub's source archive: sljit is a git submodule since
# 10.45, and that archive has none of it. The SHA-256 is the one GitHub records for the release
# asset. The build follows NON-AUTOTOOLS-BUILD: its three generic files copied into place
# ('copies'), config.h's defaults kept, and the options set on the command line --
# PCRE2_CODE_UNIT_WIDTH=8, SUPPORT_PCRE2_8, SUPPORT_UNICODE and SUPPORT_JIT. On Windows the DLL
# is built without PCRE2_STATIC, so pcre2_internal.h dllexports the API, and the archive with
# it, so a static program exports nothing of PCRE2's.
#
# 10.49 (2026-09-28) is a security release: CVE-2026-103111, an out-of-bounds write through a
# growable JIT stack. 10.48 fixed the 2026 run before it (CVE-2026-86145, -89161 and others).
# Do not pin anything older.
#
# THE NAMES are what '#foreignlib PCRE2 ... "lib/pcre2"' probes: pcre2_<os>_<arch>.a for
# static; for dynamic pcre2.dll on Windows -- the name inside it, which a program's import
# names -- pcre2_linux_x86_64.so on Linux and pcre2_macos_arm64.dylib on macOS.
version = "10.49"

[windows.1]
kind = "cbuild"
url = "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.49/pcre2-10.49.tar.gz"
sha256 = "929f0b20e62879252a15886b06c89f1edef61a363cbd5826fb041080a5e557ae"
dir = "pcre2-10.49"
copies = "src/config.h.generic:src/config.h src/pcre2.h.generic:src/pcre2.h src/pcre2_chartables.c.dist:src/pcre2_chartables.c"
sources = "src/pcre2_auto_possess.c src/pcre2_chkdint.c src/pcre2_chartables.c src/pcre2_compile.c src/pcre2_compile_cgroup.c src/pcre2_compile_class.c src/pcre2_config.c src/pcre2_context.c src/pcre2_convert.c src/pcre2_dfa_match.c src/pcre2_error.c src/pcre2_extuni.c src/pcre2_find_bracket.c src/pcre2_jit_compile.c src/pcre2_maketables.c src/pcre2_match.c src/pcre2_match_data.c src/pcre2_match_next.c src/pcre2_newline.c src/pcre2_ord2utf.c src/pcre2_pattern_info.c src/pcre2_script_run.c src/pcre2_serialize.c src/pcre2_string_utils.c src/pcre2_study.c src/pcre2_substitute.c src/pcre2_substring.c src/pcre2_tables.c src/pcre2_ucd.c src/pcre2_valid_utf.c src/pcre2_xclass.c"
cflags = "-O2 -DHAVE_CONFIG_H -DPCRE2_CODE_UNIT_WIDTH=8 -DSUPPORT_PCRE2_8 -DSUPPORT_UNICODE -DSUPPORT_JIT -D_CRT_SECURE_NO_WARNINGS"
shared = "lib/pcre2.dll"

