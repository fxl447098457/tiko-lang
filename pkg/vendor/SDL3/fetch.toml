# vendor/SDL3's binaries, for build/vendorfetch.sh. Read by that script alone and never
# shipped; the entry format is described in ../sqlite3/fetch.toml.
#
# THE NAME is what '#foreignlib SDL3 dynamic "lib/SDL3"' probes: on Windows the DLL keeps its
# own name, SDL3.dll -- the name inside it, which a program's import names; image/, ttf/ and
# mixer/'s '#foreignlib' probe "../lib/SDL3_image" and the like, beside it. SDL publishes
# release binaries for Windows only, and no static library; the mixer archive's optional/ DLLs
# (extra formats, loaded on demand) are not shipped. 'version' is SDL3's own; each satellite's
# is in its url.
#
# THE SOURCES (2026-11-17): SDL3_image 3.4.0-3.4.8 have a stack out-of-bounds read in the ILBM
# loader (CVE-2026-117557), fixed on release-3.4.x by 9c0622c and hardened by 2021bc66b, both
# after 3.4.8, the last release; SDL_image is built from release-3.4.x's head, 84d04c9, until a
# 3.4.9 is out. FreeType 2.14.3 has the four Project Zero bugs of oss-security 2026-06-06
# (SHZ, IUP, tt_interpolate_deltas, COLR v0 blending); 2.15.0 carries all four fixes. Upstream's
# Windows SDL3_ttf-3.2.2 DLL carries FreeType 2.13.2 and its SDL3_image DLL is 3.4.4, so on
# Windows SDL3.dll, SDL3_ttf.dll and SDL3_image.dll are built from these sources too, by
# static/build.sh, with the static libraries -- SDL3.dll is built rather than downloaded so the
# satellites link against the very SDL beside them. SDL3_mixer.dll is still upstream's.
version = "3.4.14"

