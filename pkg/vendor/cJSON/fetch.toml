# vendor/cJSON's binaries, for build/vendorfetch.sh. Read by that script alone and never
# shipped; the entry format is described in ../sqlite3/fetch.toml.
#
# cJSON publishes no binaries, so every host builds both C files -- cJSON.c and cJSON_Utils.c,
# one library, which vendor/cJSON and vendor/cJSON/utils both use -- from a pinned source
# archive (THE SOURCE, below). On Windows the DLL is built with CJSON_EXPORT_SYMBOLS (cJSON.h's
# own default) and the archive with CJSON_HIDE_SYMBOLS, so a static program exports nothing of
# cJSON's.
#
# THE SOURCE IS A PINNED COMMIT, PATCHED (2026-11-17): 1.7.19, the last release, has known
# memory-safety and denial-of-service bugs in cJSON_Utils (CVE-2026-87933, -67215, -67216,
# -29036). Master at 6d9f244 carries the CVE-2026-87933 fix (PR #1065) and four others since
# 1.7.19; patches/ carries four open, unmerged upstream PRs, read and stacked here -- #1109
# (MergePatch's other use-after-free), #1115 (CVE-2026-67215), #1116 (CVE-2026-67216) and #1120
# (CVE-2026-29036). The headers are unchanged since 1.7.19, so the binding is too. Move to a
# release, and drop the patches, once one carries these fixes. NOT applied: PR #1114
# (CVE-2026-67217, ApplyPatches made atomic) -- it routes every successful call through
# overwrite_item, which frees a const key string or a referenced child on the root; and PR
# #1117 (CVE-2026-16554) -- an overflow of a 32-bit size_t only, and tiko targets 64-bit hosts.
#
# THE NAMES are what '#foreignlib CJSON ... "lib/cJSON"' probes: cJSON_<os>_<arch>.a for
# static; for dynamic cJSON.dll on Windows -- the name inside it, which a program's import
# names -- cJSON_linux_x86_64.so on Linux and cJSON_macos_arm64.dylib on macOS.
version = "1.7.19+6d9f244"

[windows.1]
kind = "cbuild"
url = "https://github.com/DaveGamble/cJSON/archive/6d9f2443ab071f86e5d9b43025a40929ec41c46c.tar.gz"
sha256 = "2ee53560eb76b6d84d96989689ff46ccc4cd1a9c786967486b3105a7087d1756"
dir = "cJSON-6d9f2443ab071f86e5d9b43025a40929ec41c46c"
sources = "cJSON.c cJSON_Utils.c"
patches = "patches/0001-mergepatch-uaf-nonobject-target.patch patches/0002-json-patch-depth-CVE-2026-67215.patch patches/0003-compare-cost-CVE-2026-67216.patch patches/0004-pointer-unescape-CVE-2026-29036.patch"
cflags = "-O2 -D_CRT_SECURE_NO_WARNINGS -DCJSON_EXPORT_SYMBOLS"
shared = "lib/cJSON.dll"

[windows.2]
kind = "cbuild"
url = "https://github.com/DaveGamble/cJSON/archive/6d9f2443ab071f86e5d9b43025a40929ec41c46c.tar.gz"
sha256 = "2ee53560eb76b6d84d96989689ff46ccc4cd1a9c786967486b3105a7087d1756"
dir = "cJSON-6d9f2443ab071f86e5d9b43025a40929ec41c46c"
sources = "cJSON.c cJSON_Utils.c"
patches = "patches/0001-mergepatch-uaf-nonobject-target.patch patches/0002-json-patch-depth-CVE-2026-67215.patch patches/0003-compare-cost-CVE-2026-67216.patch patches/0004-pointer-unescape-CVE-2026-29036.patch"
cflags = "-O2 -D_CRT_SECURE_NO_WARNINGS -DCJSON_HIDE_SYMBOLS"
static = "lib/cJSON_windows_x86_64.a"

[linux.1]
kind = "cbuild"
url = "https://github.com/DaveGamble/cJSON/archive/6d9f2443ab071f86e5d9b43025a40929ec41c46c.tar.gz"
sha256 = "2ee53560eb76b6d84d96989689ff46ccc4cd1a9c786967486b3105a7087d1756"
dir = "cJSON-6d9f2443ab071f86e5d9b43025a40929ec41c46c"
sources = "cJSON.c cJSON_Utils.c"
patches = "patches/0001-mergepatch-uaf-nonobject-target.patch patches/0002-json-patch-depth-CVE-2026-67215.patch patches/0003-compare-cost-CVE-2026-67216.patch patches/0004-pointer-unescape-CVE-2026-29036.patch"
cflags = "-O2 -fPIC"
static = "lib/cJSON_linux_x86_64.a"
shared = "lib/cJSON_linux_x86_64.so"
libs = "-lm"

