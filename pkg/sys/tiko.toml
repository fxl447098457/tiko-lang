# The sys package: operating-system support written in tiko, one module tree per OS.
# sys/win is the Windows foundation -- Win32 helpers, string procs, colours -- and the parent of
# every Windows-specific module: sys/win/com, gui, richedit, gdiplus, direct2d, webview2.
# sys/posix is internal and not a module: the measured POSIX binding (build/posixgen.sh) the
# std modules' Unix code includes as a private header (sys/posix/posix.ti).
# Source only: no [vendor] table, so '#import ... link' on it is an error; it links
# nothing beyond the system import libraries the toolchain already ships.
# Reserved like std and vendor: found in the toolchain's pkg/ alone.
[package]
name = "sys"
version = "0.1.0"
description = "Operating-system support: Windows (sys/win), the POSIX binding (sys/posix)"
license = "MIT"
authors = ["José Roca"]

# NULL AND MAX_PATH ARE crt's MACROS in every sys module. win/windef.bi declares 'const NULL = 0'
# and 'const MAX_PATH = 260' only '#ifndef' the name, and crt/stddef.bi / crt/win32/stdlib.bi
# define the macros only '#ifndef' it too, so which one a unit gets is whichever header it read
# first. A sys/win unit reads windows.bi first and got the CONSTS, and its interface then spelled
# 'NULL' -- which an importer that read crt first (through vendor/SDL3's public SDL.ti, say)
# holds as a macro, never declares as a const, and does not expand in interface text: 'a
# parameter default names 'null', which is not declared' (TKO0675). As macros here, the
# interfaces spell '0' and '260' and depend on neither. Defines of the package's own modules
# only: an importer never sees them (RFC-0007 §2).
[defines]
NULL = "0"
MAX_PATH = "260"
