# ci.yml -- the first second machine (review BLD-13, 2026-10-24).
#
# Windows and Linux: fetch the pinned seed, build Debug with the test runner, lint. The
# fbc gates (crosslink, check-*.sh) need fbc-modern and stay a local or self-hosted job:
# without an oracle they exit 77, SKIPPED.
#
# THE SUITE STILL LINKS toolchains/tiko-<host>/lib (review BLD-01), which is gitignored.
# The seed IS a packaged toolchain, so its lib/ and inc/ are laid out there for the tests.
# When the suite builds lib/rt for itself this step goes.
#
# EVERYTHING RUNS IN PARALLEL (2026-11-08). Both builders compile, lint and upload bin/;
# five suite shards PER SYSTEM download it and each runs a slice of tests/ by directory,
# hand-balanced against measured durations -- mir and diagnostics are dumps and
# compile-to-error (fast), std's RUN tests compile and execute (slow, one shard of their
# own). The wall clock is the builders plus the slowest shard. Two mingw lanes -- win32
# and win64 -- build and smoke their target in parallel with all of it: build/smoke.sh
# compiles and runs seven programs against the target's own runtime archive.
#
# THE RUNNER'S OWN MSYS2 IS THE MINGW TOOLCHAIN (2026-11-08). MINGW32 and MINGW64
# are the i686/x86_64 MSVCRT environments lib/win32 and lib/win64 were built
# against; the runner's LLVM clang drives the *-w64-windows-gnu triples and finds
# its sysroot through the <arch>-w64-mingw32-gcc on PATH. pacman installs gcc from
# mirror.msys2.org in ~50 MB packages and caches them -- no 274 MB winlibs zip off
# a release CDN that answers 504 on roughly two requests in five. Both environments
# are deprecated upstream (MINGW32 has no replacement), but their gcc 16.2.0-6
# packages are still built and are the same version winlibs shipped.
#
# The full suite cannot go per-target yet (its cli tests name the target in the file);
# that, and a win32 lane in these jobs proper, stay Phase 4.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      TIKO_EDITOR_DIR: /c/nonexistent
    steps:
      # THE BYTES AS COMMITTED, as tiko-lang's own checkouts have them (core.autocrlf false).
      # The runner's default, true, turned pkg/sys/posix/*.ti into CRLF while .gitattributes
      # keeps lib/rt LF, and lint's byte compare of the two copies failed on identical blobs.
      - name: No line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Cache the pinned seed
        uses: actions/cache@v4
        with:
          path: seed/cache
          key: seed-windows-${{ hashFiles('seed/seed.lock') }}
      - name: Fetch the pinned seed
        run: "sh -c '[ -d seed/cache/windows ] || sh seed/fetch-seed.sh --host windows'"
      - name: clang
        run: |
          command -v clang || echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"
      - name: Build (Debug, test runner)
        run: bash build/build.sh Debug --no-dll --test-runner
      - name: Lint
        run: |
          bash build/lint.sh
          bash lib/rt/build/lint.sh
      - name: Upload bin for the shards
        uses: actions/upload-artifact@v4
        with:
          name: windows-bin
          path: bin/
          retention-days: 1

  suite-windows:
    # THE WINDOWS SHARDS -- the slices of tests/, on the artifact's binaries. --no-build
    # skips the staleness logic; the lib/rt each shard needs is rebuilt by test.sh's
    # overlay against the downloaded binaries.
    runs-on: windows-latest
    timeout-minutes: 40
    needs: windows
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      TIKO_EDITOR_DIR: /c/nonexistent
      TIKO_TEST_TIMEOUT: "900"
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: diagnostics
            dirs: "tests/diagnostics tests/types tests/symbols tests/api tests/mangle tests/lexer tests/rtl tests/check"
          - name: mir
            dirs: "tests/mir"
          - name: codegen
            dirs: "tests/codegen tests/parser tests/pp tests/c2t tests/cimport"
          - name: modules-driver
            dirs: "tests/modules tests/driver tests/source tests/abi tests/expected tests/semantic tests/vendor"
          - name: std
            dirs: "tests/std"
    steps:
      - name: No line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Cache the pinned seed
        uses: actions/cache@v4
        with:
          path: seed/cache
          key: seed-windows-${{ hashFiles('seed/seed.lock') }}
      - name: Fetch the pinned seed
        run: "sh -c '[ -d seed/cache/windows ] || sh seed/fetch-seed.sh --host windows'"
      - name: Lay out the seed's toolchain where the tests link it
        run: |
          mkdir -p toolchains
          cp -r seed/cache/windows/tiko-windows toolchains/tiko-windows || cp -r seed/cache/windows toolchains/tiko-windows
      - name: clang
        run: |
          command -v clang || echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"
      - name: Download bin
        uses: actions/download-artifact@v4
        with:
          name: windows-bin
          path: bin/
      - name: Suite (shard ${{ matrix.shard.name }})
        run: bash build/test.sh --no-build ${{ matrix.shard.dirs }}

  linux:
    # THE LINUX BUILDER: compiles the compiler and the runner, lints, and uploads bin/
    # for the shards. Nothing here runs the suite.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      TIKO_EDITOR_DIR: /nonexistent
    steps:
      - uses: actions/checkout@v4
      - name: LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18
          echo "TIKO_CLANG=/usr/bin/clang-18" >> "$GITHUB_ENV"
          echo "TIKO_AR=/usr/bin/llvm-ar-18" >> "$GITHUB_ENV"
          echo "TIKO_NM=/usr/bin/llvm-nm-18" >> "$GITHUB_ENV"
      - name: Cache the pinned seed
        uses: actions/cache@v4
        with:
          path: seed/cache
          key: seed-linux-${{ hashFiles('seed/seed.lock') }}
      - name: Fetch the pinned seed
        run: "sh -c '[ -d seed/cache/linux ] || sh seed/fetch-seed.sh --host linux'"
      - name: Lay out the seed's toolchain where the tests link it
        run: |
          mkdir -p toolchains
          cp -r seed/cache/linux/tiko-linux toolchains/tiko-linux || cp -r seed/cache/linux toolchains/tiko-linux
          ls toolchains/tiko-linux/lib
      - name: Build (Debug, test runner)
        run: bash build/build.sh Debug --no-dll --test-runner
      - name: Lint
        run: |
          bash build/lint.sh
          bash lib/rt/build/lint.sh
      - name: Upload bin for the shards
        uses: actions/upload-artifact@v4
        with:
          name: linux-bin
          path: bin/
          retention-days: 1

  suite-linux:
    # THE LINUX SHARDS -- the same slices the windows shards run, on faster runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: linux
    env:
      TIKO_EDITOR_DIR: /nonexistent
      TIKO_TEST_TIMEOUT: "900"
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: diagnostics
            dirs: "tests/diagnostics tests/types tests/symbols tests/api tests/mangle tests/lexer tests/rtl tests/check"
          - name: mir
            dirs: "tests/mir"
          - name: codegen
            dirs: "tests/codegen tests/parser tests/pp tests/c2t tests/cimport"
          - name: modules-driver
            dirs: "tests/modules tests/driver tests/source tests/abi tests/expected tests/semantic tests/vendor"
          - name: std
            dirs: "tests/std"
    steps:
      - uses: actions/checkout@v4
      - name: LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18
          echo "TIKO_CLANG=/usr/bin/clang-18" >> "$GITHUB_ENV"
          echo "TIKO_AR=/usr/bin/llvm-ar-18" >> "$GITHUB_ENV"
          echo "TIKO_NM=/usr/bin/llvm-nm-18" >> "$GITHUB_ENV"
      - name: Cache the pinned seed
        uses: actions/cache@v4
        with:
          path: seed/cache
          key: seed-linux-${{ hashFiles('seed/seed.lock') }}
      - name: Fetch the pinned seed
        run: "sh -c '[ -d seed/cache/linux ] || sh seed/fetch-seed.sh --host linux'"
      - name: Lay out the seed's toolchain where the tests link it
        run: |
          mkdir -p toolchains
          cp -r seed/cache/linux/tiko-linux toolchains/tiko-linux || cp -r seed/cache/linux toolchains/tiko-linux
      - name: Download bin
        uses: actions/download-artifact@v4
        with:
          name: linux-bin
          path: bin/
      - name: Make the binaries executable
        run: chmod +x bin/*
      - name: Suite (shard ${{ matrix.shard.name }})
        run: bash build/test.sh --no-build ${{ matrix.shard.dirs }}

  win32-smoke:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      TIKO_EDITOR_DIR: /c/nonexistent
    steps:
      - name: No line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      # MINGW32 IS THE i686 MSVCRT ENVIRONMENT lib/win32 was built against, and
      # release:false reuses the runner's C:\msys64. setup-msys2 caches pacman's
      # package downloads itself, so there is no toolchain cache to maintain here.
      - name: Install the i686 MinGW toolchain (MSYS2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          release: false
          update: true
          install: mingw-w64-i686-gcc
          suppress-deprecation-warnings: msystem-mingw32
      - name: mingw32 and clang on PATH
        run: |
          # WINDOWS-STYLE PATHS ON PURPOSE: clang.exe is a native Windows program
          # and searches PATH for i686-w64-mingw32-gcc to name its sysroot; it
          # cannot see a /c/... entry. GITHUB_PATH applies from the next step on.
          echo "C:/msys64/mingw32/bin" >> "$GITHUB_PATH"
          echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"
      - name: Toolchain versions
        run: |
          i686-w64-mingw32-gcc.exe --version | head -1
          clang.exe --version | head -1
      - name: Cache the pinned seed
        uses: actions/cache@v4
        with:
          path: seed/cache
          key: seed-windows-${{ hashFiles('seed/seed.lock') }}
      - name: Fetch the pinned seed
        run: "sh -c '[ -d seed/cache/windows ] || sh seed/fetch-seed.sh --host windows'"
      - name: Build (Release, no dll)
        run: bash build/build.sh Release --no-dll
      - name: lib/rt for win32
        run: TIKORT_TIKO="$PWD/bin/tiko.exe" bash lib/rt/build/build.sh Release win32
      - name: Stage the i686 CRT libraries beside libfb.a
        run: |
          # clang 20's MinGW driver searches C:\msys64\mingw32\i686-w64-mingw32\lib
          # for -lmingw32/-lmoldname/-lmingwex/-lmsvcrt/-lkernel32 and crt2.o, but
          # MSYS2 keeps all of them in /mingw32/lib (measured with clang -###).
          # tiko emits -L and -B for every library path, so laying them beside the
          # runtime it just built gives lld the directory it is missing. --sysroot
          # would do it too, but the driver's link line has no way to name one today.
          # (-lwinspool/-lgdi32 are gone from this link line: printerwin.tiko loads
          # the spooler and GDI at runtime now.)
          cp -f /c/msys64/mingw32/lib/*.a lib/rt/lib/win32/
          for f in /c/msys64/mingw32/lib/crt*.o; do
            [ -f "$f" ] && cp -f "$f" lib/rt/lib/win32/
          done
      - name: Smoke (win32)
        env:
          # A CLEAN CHECKOUT HAS NO lib/<target>/ -- its archives and startup
          # object are gitignored build products. The lane builds the runtime into
          # lib/rt/lib/win32, so name that tree for the driver; TIKO_LIBPATH is
          # the same override build/test.sh's overlay uses. Without it the first
          # smoke program dies TKO0111: fbrt0.o is on no library path.
          TIKO_LIBPATH: ${{ github.workspace }}/lib/rt/lib/win32
        run: |
          bash build/smoke.sh win32
          bash build/smoke.sh win32 --mt
          # THE CONTRACT: io_openqb.o takes fb_DevLptOpen's address for every
          # program that calls OPEN, so the printer driver IS in these binaries.
          # It must not drag WINSPOOL.DRV / GDI32.dll into a console program's
          # import table -- printerwin.tiko resolves those calls at runtime.
          ro=$(command -v llvm-readobj || command -v llvm-readobj.exe || true)
          if [ -z "$ro" ]; then echo "smoke: llvm-readobj unavailable, import check skipped"; exit 0; fi
          for f in build/obj/smoke/win32/*.exe; do
            if "$ro" --coff-imports "$f" | grep -qiE '^  Name: (WINSPOOL|GDI32)'; then
              echo "smoke: FAIL $f still imports the print subsystem" >&2
              exit 1
            fi
          done
          echo "smoke: no WINSPOOL.DRV / GDI32.dll imports (win32)"

  win64-smoke:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      TIKO_EDITOR_DIR: /c/nonexistent
    steps:
      - name: No line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      # MINGW64 IS THE x86_64 MSVCRT ENVIRONMENT -- lib/win64 is an msvcrt-flavor
      # archive, and the ucrt-flavor UCRT64/CLANG64 would not answer its imports.
      - name: Install the x86_64 MinGW toolchain (MSYS2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: false
          update: true
          install: mingw-w64-x86_64-gcc
          suppress-deprecation-warnings: msystem-mingw64
      - name: mingw64 and clang on PATH
        run: |
          # clang.exe finds its sysroot through x86_64-w64-mingw32-gcc on PATH;
          # see the win32 lane for why these paths are Windows-style.
          echo "C:/msys64/mingw64/bin" >> "$GITHUB_PATH"
          echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"
      - name: Toolchain versions
        run: |
          x86_64-w64-mingw32-gcc.exe --version | head -1
          clang.exe --version | head -1
      - name: Cache the pinned seed
        uses: actions/cache@v4
        with:
          path: seed/cache
          key: seed-windows-${{ hashFiles('seed/seed.lock') }}
      - name: Fetch the pinned seed
        run: "sh -c '[ -d seed/cache/windows ] || sh seed/fetch-seed.sh --host windows'"
      - name: Build (Release, no dll)
        run: bash build/build.sh Release --no-dll
      - name: lib/rt for win64
        run: TIKORT_TIKO="$PWD/bin/tiko.exe" bash lib/rt/build/build.sh Release win64
      - name: Smoke (win64)
        env:
          # See the win32 lane: the runtime this job just built is lib/rt/lib/win64.
          TIKO_LIBPATH: ${{ github.workspace }}/lib/rt/lib/win64
        run: |
          bash build/smoke.sh win64
          bash build/smoke.sh win64 --mt
          # See the win32 lane -- the same assertion, on the 64-bit binaries.
          ro=$(command -v llvm-readobj || command -v llvm-readobj.exe || true)
          if [ -z "$ro" ]; then echo "smoke: llvm-readobj unavailable, import check skipped"; exit 0; fi
          for f in build/obj/smoke/win64/*.exe; do
            if "$ro" --coff-imports "$f" | grep -qiE '^  Name: (WINSPOOL|GDI32)'; then
              echo "smoke: FAIL $f still imports the print subsystem" >&2
              exit 1
            fi
          done
          echo "smoke: no WINSPOOL.DRV / GDI32.dll imports (win64)"
