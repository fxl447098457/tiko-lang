# tkContacts: a small program built with the tkEdit Form Designer. Open frmContacts/frmContacts.tkform
# in tkEdit to see it on the design surface. `contacts` is the program; `selftest` drives it.
[package]
name = "tkcontacts"

[target.contacts]
main   = "main.tiko"
output = "contacts.exe"
subsystem = "gui"

[target.selftest]
main   = "selftest.tiko"
output = "selftest.exe"
