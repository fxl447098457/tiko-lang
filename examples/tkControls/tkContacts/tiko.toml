# tkContacts: the finished program of the Contacts Tutorial (wiki: Contacts-Tutorial), made in
# tkEdit's Form Designer. Open this folder in tkEdit and frmMain/frmMain.tkform to see it on the
# design surface. `contacts` is the program; `selftest` drives it.
[package]
name = "tkcontacts"

[target.contacts]
main   = "main.tiko"
output = "contacts.exe"
subsystem = "gui"

[target.selftest]
main   = "selftest.tiko"
output = "selftest.exe"

[target.contacts.windows]
resources = ["appResources/app.rc"]
