# tkRExpr: selftest (the golden table) and perf (RD0 S1's 20 expressions over 100,000 rows).
# tiko build (writes selftest.exe / perf.exe here; out/ is the cache)
[package]
name = "tkrexpr-tests"

[target.selftest]
main   = "selftest.tiko"
output = "selftest.exe"

[target.perf]
main   = "perf.tiko"
output = "perf.exe"
