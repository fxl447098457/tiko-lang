# tkOrders: a customer-and-orders program made in tkEdit's Form Designer and Report Designer,
# showing data-bound tkControls over SQLite -- a Navigator stepping through records, bound TextBox /
# ComboBox / CheckBox / DatePicker / NumericUpDown / Rating controls, a DataGrid bound to a record's
# array, a live (items_live) order-lines grid, a DataGrid that IS an SQLite query -- and three
# designed reports, one per kind of data: an invoice from an array of records (master-detail),
# sales by customer from an SQL query with date parameters, and an order list from a DataGrid.
#
# Open this folder in tkEdit, then any frm*/frm*.tkform or rpt*/rpt*.tkreport to see it on the
# design surface. `orders` is the program; `selftest` drives it against a database of its own.
# The tutorial is the wiki's Orders-Tutorial page.
[package]
name = "tkorders"

[target.orders]
main   = "main.tiko"
output = "orders.exe"
subsystem = "gui"

[target.selftest]
main   = "selftest.tiko"
output = "selftest.exe"
