# tkBarcodeForm: a designed form (BARCODE.md BC3) written as a .tkform and generated by tkEdit
# --generate-forms (frmProducts): products stepped through by a navigator, each one's EAN-13 SKU and
# its id as a QR code bound load-only. Driven as a selftest.
[package]
name = "tkbarcodeform"

[target.selftest]
main   = "selftest.tiko"
output = "selftest.exe"
