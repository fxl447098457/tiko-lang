# tkGridData: tkDataGrid G6 -- the block cache (a slow virtual feed answered later, by a worker
# thread through tkApp_RunOnUI, or filled by the grid from the feed) and tkDataGridSqlite (an
# SQLite query as the grid's rows: block fetches, ORDER BY from the header, writes by key).
[package]
name = "tkgriddata"

[target.selftest]
main   = "selftest.tiko"
output = "selftest.exe"

# perf: tkDataGridSqlite over 1,000,000 rows -- Open (count), a block at the top, one deep down
# (LIMIT / OFFSET walks the rows before it), a sort. Build with --profile release.
[target.perf]
main   = "perf.tiko"
output = "perf.exe"
