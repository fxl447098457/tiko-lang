# tkValidateForm: a form written as a .tkform with B2's rules (Required, Minimum / Maximum, Format)
# and a ValidationError handler, generated by tkEdit --generate-forms (frmOrder), driven as a
# selftest: SaveTo's strict checks and all-or-nothing write, LoadFrom's report. Form Designer B2.
[package]
name = "tkvalidateform"

[target.selftest]
main   = "selftest.tiko"
output = "selftest.exe"
