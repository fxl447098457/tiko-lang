# tkAndroid: the touch-first demo (docs/tiko-android A5). 'tiko build demo' writes demo.exe here, for
# the desktop; 'tiko build tasks -target android-x86_64' (or android-arm64) writes the Android app,
# out/<profile>/tasks.apk (docs/tiko-android A6). For Play: bundle = true writes tasks.aab, and key
# names a release keystore whose passwords are in TIKO_ANDROID_KS_PASS / TIKO_ANDROID_KEY_PASS.
[package]
name = "tkandroid-demo"

[target.demo]
main   = "demo.tiko"
output = "demo.exe"

[target.tasks]
main = "demo.tiko"
kind = "app"

[target.tasks.app]
id      = "org.tiko.tasks"
label   = "Tasks"
version = "1.0,1"
