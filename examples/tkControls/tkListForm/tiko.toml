# tkListForm: a form with list-bound controls written as a .tkform (Form Designer B3) and generated by
# tkEdit --generate-forms (frmShop), driven as a selftest: a ListTree filled from the record's
# Array( of Line ), and two ComboBoxes filled from an array and bound by their items' ValueField.
[package]
name = "tklistform"

[target.selftest]
main   = "selftest.tiko"
output = "selftest.exe"
