# tkLanguage: selftest, and embedded -- a program whose catalog is built in (#embed) and that needs
# no lang/ folder beside it. tiko build (writes both .exe here; out/ is the cache)
[package]
name = "tklanguage-tests"

[target.selftest]
main   = "selftest.tiko"
output = "selftest.exe"

[target.embedded]
main   = "embedded.tiko"
output = "embedded.exe"
