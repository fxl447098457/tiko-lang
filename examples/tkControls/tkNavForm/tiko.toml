# tkNavForm: a master-detail form written as a .tkform (Form Designer B4) and generated by tkEdit
# --generate-forms (frmPeople): a list of people, their details bound, and a navigator that steps
# through them, saving a changed record before it moves. Driven as a selftest.
[package]
name = "tknavform"

[target.selftest]
main   = "selftest.tiko"
output = "selftest.exe"
