# tkGridForm: a form with a list-bound DataGrid written as a .tkform (tkDataGrid G5) and generated by
# tkEdit's code generator (frmGrid; the designall suite writes it with --accept), driven as a selftest:
# LoadFrom fills the grid from the record's Array( of Line ), edits and added rows go back with SaveTo.
[package]
name = "tkgridform"

[target.selftest]
main   = "selftest.tiko"
output = "selftest.exe"
