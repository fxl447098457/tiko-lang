# tkReportDesigner: a report designed in a .tkreport, its module generated by tkEdit (--generate-forms)
[package]
name = "tkreportdesigner"

# the program first: tkEdit builds and runs a project's first target
[target.orders]
main   = "main.tiko"
output = "orders.exe"
subsystem = "gui"

[target.selftest]
main   = "selftest.tiko"
output = "selftest.exe"
