# tkMatch: selftest (console) and the A0-P perf gate. tiko build (writes the exes here; out/ is the cache)
[package]
name = "tkmatch-tests"

[target.selftest]
main   = "selftest.tiko"
output = "selftest.exe"

# the A0-P perf gate: tiko build --profile release, then ./perf.exe
[target.perf]
main   = "perf.tiko"
output = "perf.exe"
